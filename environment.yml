name: agri-rapids
channels:
  - rapidsai
  - conda-forge
  - nvidia
  - defaults

dependencies:
  # Python
  - python=3.10

  # RAPIDS (GPU) - CUDA 12.x
  - rapids=24.10
  - cuda-version=12.0

  # Data
  - pandas>=2.0.0
  - numpy>=1.24.0

  # ML
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0

  # Visualisation
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Jupyter
  - jupyterlab>=4.0
  - ipywidgets>=8.0.0

  # Pip packages (pas disponibles via conda)
  - pip:
    - shap>=0.45.0
    - requests>=2.31.0
    - tqdm>=4.65.0
